<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>إرسال ملف — ProStudio</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;600;700&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#07080c;--ink:#f4efe4;--muted:#b7b0a3;--line:rgba(244,239,228,.12);
        --card:rgba(16,17,23,.78);--gold:#e8b86d;--ok:#7dcea0}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
       font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;
       background-image:radial-gradient(circle at 12% 6%,rgba(232,184,109,.15),transparent 38%),
                        radial-gradient(circle at 90% 88%,rgba(90,140,255,.10),transparent 34%)}
  header{padding:24px 6vw 0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px}
  .mark{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;
        background:linear-gradient(160deg,var(--gold),#9a6a2c);color:#1a1208;font-weight:700}
  .brand strong{display:block}.brand small{color:var(--muted)}
  nav a{color:var(--muted);text-decoration:none;font-size:14.5px;margin-inline-start:16px}
  nav a:hover,nav a.on{color:var(--gold)}
  main{max-width:640px;margin:0 auto;padding:40px 6vw 60px;text-align:center}
  h1{font-size:clamp(26px,4.6vw,38px);margin:0 0 10px}
  .lede{color:var(--muted);margin:0 0 30px;font-size:16.5px;line-height:1.8}

  .drop{display:block;border:2px dashed var(--line);border-radius:20px;
        padding:64px 28px;cursor:pointer;transition:.18s;background:var(--card)}
  .drop:hover,.drop.hot{border-color:var(--gold);background:rgba(232,184,109,.07)}
  .drop.has{border-color:var(--ok);background:rgba(125,206,160,.08)}
  .icon{font-size:44px;line-height:1;margin-bottom:16px;opacity:.85}
  .drop strong{display:block;font-size:19px;margin-bottom:8px}
  .drop em{color:var(--muted);font-style:normal;font-size:14.5px;line-height:1.9}

  .files{margin:18px 0 0;text-align:start;display:none}
  .files.on{display:block}
  .file{display:flex;align-items:center;gap:12px;background:var(--card);
        border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:8px}
  .file .nm{flex:1;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .file .sz{color:var(--muted);font-size:13px;white-space:nowrap}
  .file .x{color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:0 4px}
  .file .x:hover{color:var(--gold)}

  .cta{display:block;width:100%;padding:17px;border-radius:13px;font-size:16.5px;
       font-weight:700;border:0;cursor:pointer;margin-top:22px;font-family:inherit;
       background:linear-gradient(160deg,var(--gold),#c98f3f);color:#1a1208;text-decoration:none}
  .cta[hidden]{display:none}
  .cta:hover{filter:brightness(1.07)}

  .note{border-inline-start:3px solid var(--gold);padding:14px 18px;margin-top:24px;
        background:rgba(232,184,109,.07);border-radius:0 12px 12px 0;font-size:14.5px;
        color:var(--muted);line-height:1.9;text-align:start}
  .note b{color:var(--ink)}
  footer{color:var(--muted);font-size:13.5px;text-align:center;padding:0 6vw 40px}
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="mark">PS</span>
    <div><strong>ProStudio</strong><small>إرسال ملف</small></div>
  </div>
  <nav>
    <a href="index.html">الرئيسية</a>
    <a href="preview.html">المعاينة</a>
    <a href="send.html" class="on">إرسال</a>
  </nav>
</header>

<main>
  <h1>أرسل ملفك</h1>
  <p class="lede">فيديو أو صوت — اسحبه أو اختره، وسأتولى الباقي.</p>

  <label class="drop" id="drop">
    <input id="file" type="file" multiple hidden
           accept="video/*,audio/*,.mp4,.mkv,.webm,.mov,.m4v,.avi,.mp3,.wav,.m4a,.aac,.ogg,.flac" />
    <div class="icon">⬆</div>
    <strong id="title">اسحب الملف هنا</strong>
    <em id="hint">أو اضغط للاختيار<br>MP4 · MKV · MOV · MP3 · WAV · M4A</em>
  </label>

  <div class="files" id="files"></div>

  <a class="cta" id="go" hidden target="_blank" rel="noopener">إرسال ←</a>

  <div class="note">
    <b>الخطوة الأخيرة:</b> بعد الضغط على «إرسال» تُفتح صفحة GitHub —
    <b>اسحب ملفك داخل مربع النص هناك</b> وانتظر اكتمال الرفع، ثم اضغط
    <b>Submit new issue</b>.
  </div>
</main>

<footer>ProStudio · رخصة MIT</footer>

<script>
const $ = id => document.getElementById(id);
const drop = $('drop'), input = $('file'), box = $('files'), go = $('go');
let picked = [];

const fmt = b => b < 1048576
  ? (b / 1024).toFixed(0) + ' كيلوبايت'
  : (b / 1048576).toFixed(1) + ' ميغابايت';

function render(){
  if (!picked.length){
    box.classList.remove('on');
    box.innerHTML = '';
    drop.classList.remove('has');
    $('title').textContent = 'اسحب الملف هنا';
    $('hint').innerHTML = 'أو اضغط للاختيار<br>MP4 · MKV · MOV · MP3 · WAV · M4A';
    go.hidden = true;
    return;
  }

  box.classList.add('on');
  box.innerHTML = picked.map((f, i) => `
    <div class="file">
      <span class="nm">${f.name}</span>
      <span class="sz">${fmt(f.size)}</span>
      <span class="x" data-i="${i}" title="إزالة">×</span>
    </div>`).join('');

  box.querySelectorAll('.x').forEach(el => {
    el.onclick = e => {
      e.preventDefault();
      e.stopPropagation();
      picked.splice(+el.dataset.i, 1);
      render();
    };
  });

  drop.classList.add('has');
  $('title').textContent = picked.length === 1
    ? 'ملف جاهز للإرسال'
    : `${picked.length} ملفات جاهزة`;
  $('hint').textContent = 'اضغط لإضافة المزيد';

  // GitHub hosts the upload itself; the body just names what is coming so the
  // request is readable before the file finishes attaching.
  const list = picked.map(f => `- ${f.name} (${fmt(f.size)})`).join('\n');
  const body = [
    '## الملف',
    '',
    '<!-- اسحب الملف هنا وانتظر اكتمال الرفع -->',
    '',
    '',
    '---',
    '',
    list,
  ].join('\n');

  const q = new URLSearchParams({
    title: `[دبلجة] ${picked[0].name}`,
    body,
    labels: 'dub-request',
  });
  go.href = `https://github.com/dhiyaddineb-hue/prostudio/issues/new?${q}`;
  go.hidden = false;
}

function add(list){
  for (const f of list) picked.push(f);
  render();
}

input.addEventListener('change', e => { add(e.target.files); input.value = ''; });

['dragenter','dragover'].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('hot'); }));
['dragleave','drop'].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('hot'); }));
drop.addEventListener('drop', e => { if (e.dataTransfer.files.length) add(e.dataTransfer.files); });

render();
</script>

</body>
</html>
