name: Clone voices and dub

# Neural cloning needs model weights from HuggingFace, which is unreachable from
# the dev sandbox. GitHub's runners can reach it, so the clone runs here: the
# reference audio is cut from the original actor, F5-TTS speaks each line in
# that voice, and the finished dub comes back as an artifact.

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Project folder under projects/"
        required: true
        default: "Phantom-Thread"
        type: string
      model:
        description: "F5-TTS model"
        required: true
        default: "F5TTS_v1_Base"
        type: choice
        options:
          - F5TTS_v1_Base
          - F5TTS_Base
      ref_seconds:
        description: "Seconds of the actor to clone from (3-12)"
        required: true
        default: "8"
        type: string

jobs:
  clone:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # The weights are the slow part; keep them between runs.
      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ inputs.model }}-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install f5-tts soundfile numpy praat-parselmouth

      - name: Confirm the weights are reachable
        run: |
          python - <<'PY'
          from f5_tts.api import F5TTS
          F5TTS()          # downloads on first use; fails loudly if blocked
          print("F5-TTS ready")
          PY

      - name: Clone each line in the original actor's voice
        env:
          PROJECT: ${{ inputs.project }}
          REF_SECONDS: ${{ inputs.ref_seconds }}
        run: python scripts/clone_project.py

      - name: Render the dub
        env:
          PROJECT: ${{ inputs.project }}
        run: python scripts/build_phantom_dub.py

      - name: Upload the cloned dub
        uses: actions/upload-artifact@v4
        with:
          name: cloned-dub-${{ inputs.project }}
          path: |
            projects/${{ inputs.project }}/output/*.mp4
            projects/${{ inputs.project }}/output/*.srt
            projects/${{ inputs.project }}/voices/*.wav
          if-no-files-found: error
          retention-days: 30
