name: CI

on:
  push:
    branches: [main, master, arena/**]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: Test
        run: python -m pytest tests/ -v
