[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "prostudio"
version = "1.0.0"
description = "ProStudio — YouTube Auto Dub ready for direct use"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.1",
    "torch>=2.0",
    "yt-dlp>=2024.12.0",
    "pydub>=0.25",
    "edge-tts>=6.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "numpy>=1.26",
    "rich>=13.0",
    "soundfile>=0.12",
    "imageio-ffmpeg>=0.5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "aiofiles>=24.1",
    "espeakng-loader>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.24",
]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.scripts]
youtube-auto-dub = "youtube_auto_dub.cli:main"
prostudio = "web.server:main"

[tool.setuptools.packages.find]
include = ["youtube_auto_dub*", "web*"]

[tool.setuptools.package-data]
youtube_auto_dub = ["language_map.json"]
web = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
