name: Run YouTube Auto Dub

permissions:
  contents: write

concurrency:
  group: prostudio-dub-${{ github.ref }}
  cancel-in-progress: false

# Two jobs, pick one from the "Run workflow" dropdown:
#   clone  — re-record a project's lines in the original actor's voice (F5-TTS)
#   dub    — dub a YouTube URL from scratch
#
# Cloning needs model weights from HuggingFace. That host is blocked in the dev
# sandbox but reachable from GitHub's runners, which is the whole reason this
# workflow exists.

on:
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        required: true
        default: "dub"
        type: choice
        options:
          - clone
          - dub
      project:
        description: "clone: project folder under projects/"
        required: false
        default: "Phantom-Thread"
        type: string
      ref_seconds:
        description: "clone: seconds of the actor to clone from (3-12)"
        required: false
        default: "8"
        type: string
      max_cues:
        description: "clone: 0 = all lines, or e.g. 3 for a quick voice preview"
        required: false
        default: "0"
        type: string
      youtube_url:
        description: "dub: video URL (leave empty when using source_path)"
        required: false
        default: ""
        type: string
      source_path:
        description: "dub: path to a video already in this repository"
        required: false
        default: "samples/ProStudio_Arabic_Demo.mp4"
        type: string
      source_lang:
        description: "dub: original audio language"
        required: false
        default: "ar"
        type: string
      voice:
        description: "dub: Edge-TTS voice short name"
        required: false
        default: "en-US-AndrewMultilingualNeural"
        type: string
      tts_engine:
        description: "dub: speech engine (xtts is opt-in; default is voxcpm)"
        required: false
        default: "voxcpm"
        type: choice
        options: [xtts, edge, voxcpm, qwen]
      target_lang:
        description: "dub: target language"
        required: false
        default: "en"
        type: string
      mode:
        description: "dub: mode"
        required: false
        default: "both"
        type: choice
        options: [both, dub, sub]
      gender:
        description: "dub: voice gender"
        required: false
        default: "male"
        type: choice
        options: [male, female]
      model:
        description: "dub: Whisper model"
        required: false
        default: "medium"
        type: choice
        options: [tiny, base, small, medium]
      bg_music:
        description: "dub: keep background music and effects when separation is reliable"
        required: false
        default: false
        type: boolean
      diarize:
        description: "dub: identify speakers automatically when HF_TOKEN is configured"
        required: false
        default: false
        type: boolean
      separate_sources:
        description: "dub: neural separation of dialogue from music/effects"
        required: false
        default: true
        type: boolean
      no_vad:
        description: "dub: disable VAD only for continuous speech that VAD wrongly drops"
        required: false
        default: false
        type: boolean
      seed_vc:
        description: "apply Seed-VC independently to every spoken smart chunk"
        required: false
        default: true
        type: boolean
      lip_sync:
        description: "deprecated: visual lip-sync is disabled; audio-only dubbing is used"
        required: false
        default: false
        type: boolean
      lip_sync_backend:
        description: "dub: verified visual backend"
        required: false
        default: "wav2lip"
        type: choice
        options: [none, wav2lip, experiment]
      profile:
        description: "dub: pipeline profile"
        required: false
        default: "safe"
        type: choice
        options: [safe, high_quality_single, multi_speaker_cinematic, experiment]
      quality:
        description: "dub: quality policy"
        required: false
        default: "balanced"
        type: choice
        options: [safe, balanced, strict]
      chunk_seconds:
        description: "dub: speech-aware hard maximum per resumable chunk (max 10)"
        required: false
        default: "10"
        type: string
      speaker_voices_path:
        description: "optional JSON file assigning every option independently per detected character"
        required: false
        default: ""
        type: string
      validate_content:
        description: "re-transcribe each generated phrase and reject missing speech"
        required: false
        default: true
        type: boolean
jobs:
  clone:
    if: inputs.task == 'clone'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out this branch
        uses: actions/checkout@v4

      - name: Ensure FFmpeg is available
        timeout-minutes: 10
        run: |
          set -euo pipefail
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            ffmpeg -version | head -1
            exit 0
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y ffmpeg
          ffmpeg -version | head -1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # The weights are the slow part of the run; keep them between runs.
      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-f5tts-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # One resolve, so pip picks a consistent set. coqui-tts (XTTS-v2)
          # needs transformers >=4.57 but breaks on 5.x, which removed
          # isin_mps_friendly — installing them separately picks 5.x and fails.
          pip install "transformers>=4.57,<5" coqui-tts f5-tts

      - name: Confirm the weights downloaded
        env:
          COQUI_TOS_AGREED: "1"
        run: |
          python - <<'PY'
          from youtube_auto_dub.xtts_clone import available, MODEL_NAME
          if available():
              print(f"XTTS-v2 ready ({MODEL_NAME})")
          else:
              from f5_tts.api import F5TTS
              F5TTS()
              print("XTTS unavailable; F5-TTS ready")
          PY

      - name: Clone each line in the original actor's voice
        env:
          PROJECT: ${{ inputs.project }}
          REF_SECONDS: ${{ inputs.ref_seconds }}
          MAX_CUES: ${{ inputs.max_cues }}
          COQUI_TOS_AGREED: "1"
        run: python scripts/clone_project.py

      # Upload the voices before rendering. Cloning costs about an hour, and a
      # later failure used to throw all of it away.
      - name: Upload the cloned voices
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloned-voices-${{ inputs.project }}
          path: |
            projects/${{ inputs.project }}/voices/*.wav
            projects/${{ inputs.project }}/work/ref_*.wav
          if-no-files-found: warn
          retention-days: 30

      - name: Render the dub
        if: inputs.max_cues == '0'
        env:
          PROJECT: ${{ inputs.project }}
        run: python scripts/build_phantom_dub.py

      - name: Upload the finished dub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloned-dub-${{ inputs.project }}
          path: |
            projects/${{ inputs.project }}/output/*.mp4
            projects/${{ inputs.project }}/output/*.srt
          if-no-files-found: warn
          retention-days: 30

  dub:
    if: inputs.task == 'dub'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out this branch
        uses: actions/checkout@v4

      - name: Ensure FFmpeg is available
        timeout-minutes: 10
        run: |
          set -euo pipefail
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            ffmpeg -version | head -1
            exit 0
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y ffmpeg
          ffmpeg -version | head -1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U yt-dlp
          pip install -r requirements.txt
          pip install faster-whisper edge-tts
          pip install gradio_client

      # Download the selected Whisper weights on the GitHub runner. The cache
      # makes later runs fast while keeping all model files inside GitHub.
      - name: Cache Whisper model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-faster-whisper-${{ inputs.model }}-v1

      - name: Download and verify Whisper model
        env:
          WHISPER_MODEL: ${{ inputs.model }}
        run: |
          python - <<'PY'
          import os
          from faster_whisper import WhisperModel
          model_name = os.environ["WHISPER_MODEL"]
          WhisperModel(model_name, device="cpu", compute_type="int8")
          print(f"Whisper model ready: {model_name}")
          PY

      - name: Cache XTTS-v2 model
        if: inputs.tts_engine == 'xtts'
        uses: actions/cache@v4
        with:
          path: ~/.local/share/tts
          key: coqui-xtts-v2-v1

      - name: Download and verify XTTS-v2
        if: inputs.tts_engine == 'xtts'
        run: |
          pip install torchaudio "transformers>=4.57,<5" "coqui-tts[codec]"
          COQUI_TOS_AGREED=1 python - <<'PY'
          from TTS.api import TTS
          TTS("tts_models/multilingual/multi-dataset/xtts_v2")
          print("XTTS-v2 ready")
          PY

      - name: Install optional speaker diarization
        if: inputs.diarize == true
        run: python -m pip install pyannote.audio
      - name: Install optional neural source separation
        if: inputs.separate_sources == true
        run: python -m pip install demucs
      - name: Write YouTube cookies
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "${YT_COOKIES}" ]; then
            printf '%s\n' "$YT_COOKIES" > cookies.txt
            echo "cookies.txt ready"
          else
            echo "No YT_COOKIES secret set; continuing without it"
          fi

      - name: Preflight environment and credentials
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          set -euo pipefail
          mkdir -p output
          ffmpeg -version >/dev/null
          python - <<'PY'
          import json, os, shutil
          report = {
            "ffmpeg": bool(shutil.which("ffmpeg")),
            "ffprobe": bool(shutil.which("ffprobe")),
            "source_lang": "${{ inputs.source_lang }}",
            "target_lang": "${{ inputs.target_lang }}",
            "tts_engine": "${{ inputs.tts_engine }}",
            "seed_vc_requested": "${{ inputs.seed_vc }}" == "true",
            "diarization_requested": "${{ inputs.diarize }}" == "true",
            "demucs_requested": "${{ inputs.separate_sources }}" == "true",
            "seed_vc_script": os.path.exists("scripts/seed_vc_enhance.py"),
            "hf_token_present": bool(os.environ.get("HF_TOKEN")),
            "youtube_cookies_present": bool(os.environ.get("YT_COOKIES")),
            "lip_sync": "disabled",
            "status": "ready_with_warnings",
          }
          if report["diarization_requested"] and not report["hf_token_present"]:
            report["status"] = "blocked_missing_hf_token"
            report["error"] = "HF_TOKEN is required when diarize=true"
          if report["seed_vc_requested"] and not report["seed_vc_script"]:
            report["status"] = "blocked_missing_seed_vc"
            report["error"] = "Seed-VC integration script is missing"
          with open("output/preflight.json", "w", encoding="utf-8") as f:
            json.dump(report, f, ensure_ascii=False, indent=2)
          print(json.dumps(report, ensure_ascii=False))
          if report["status"].startswith("blocked_"):
            raise SystemExit(report["error"])
          PY

      - name: Upload preflight diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-${{ github.run_id }}
          path: output/preflight.json
          if-no-files-found: warn
          retention-days: 14

      - name: Reassemble split source parts
        if: endsWith(inputs.source_path, '.part0')
        run: |
          set -euo pipefail
          sp="${{ inputs.source_path }}"
          if [[ "$sp" == *.part0 ]]; then
            base="${sp%.part0}"
            full="${base}.mp4"
            p0="${base}.part0"
            p1="${base}.part1"
            if [ -f "$p0" ] && [ -f "$p1" ]; then
              cat "$p0" "$p1" > "$full"
              echo "Reassembled $p0 + $p1 -> $full ($(wc -c < "$full") bytes)"
              echo "REASSEMBLED_SOURCE=${full}" >> "$GITHUB_ENV"
            else
              echo "parts missing; continuing with $sp" >&2
            fi
          fi

      - name: Prepare resumable smart-chunk project
        id: smart_project
        run: |
          set -euo pipefail
          source="${REASSEMBLED_SOURCE:-}"
          if [ -z "$source" ]; then source="${{ inputs.youtube_url }}"; fi
          if [ -z "$source" ]; then source="${{ inputs.source_path }}"; fi
          test -n "$source"
          if [[ "$source" == http://* || "$source" == https://* ]]; then
            digest=$(printf '%s' "$source" | sha256sum | cut -c1-12)
            base="youtube"
          else
            test -f "$source"
            digest=$(sha256sum "$source" | cut -c1-12)
            base=$(basename "$source")
            base="${base%.*}"
            base=$(printf '%s' "$base" | tr -cs '[:alnum:]._-' '-' | sed 's/^-//;s/-$//' | cut -c1-40)
          fi
          config=$(printf '%s' "${{ inputs.source_lang }}|${{ inputs.target_lang }}|${{ inputs.tts_engine }}|${{ inputs.voice }}|${{ inputs.gender }}|${{ inputs.model }}|${{ inputs.separate_sources }}|${{ inputs.bg_music }}|${{ inputs.diarize }}|${{ inputs.no_vad }}|${{ inputs.seed_vc }}|${{ inputs.chunk_seconds }}" | sha256sum | cut -c1-8)
          project_id="${base}-${digest}-${{ inputs.target_lang }}-${config}"
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "id=$project_id" >> "$GITHUB_OUTPUT"
          echo "release_tag=checkpoint-$project_id" >> "$GITHUB_OUTPUT"
          echo "Smart project: $project_id"

      - name: Run resumable speech-aware smart chunks
        id: smart_dub
        env:
          GH_TOKEN: ${{ github.token }}
          YAD_OUTPUT_DIR: output
          YAD_VOXCPM_BACKEND: "space"
          YAD_VOXCPM_SPACE: "openbmb/VoxCPM-Demo"
          YAD_VOXCPM_ATTEMPTS: "4"
          YAD_TEMP_DIR: temp
          YAD_CACHE_DIR: .cache
          YAD_COOKIES_FILE: cookies.txt
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          chunk_max="${{ inputs.chunk_seconds }}"
          python - <<PY
          value=float("$chunk_max")
          assert 1.0 <= value <= 10.0, "chunk_seconds must be between 1 and 10"
          PY
          extra=()
          if [ "${{ inputs.separate_sources }}" = "true" ]; then extra+=(--separate-sources); fi
          if [ "${{ inputs.bg_music }}" = "true" ]; then extra+=(--preserve-background); fi
          if [ "${{ inputs.diarize }}" = "true" ]; then extra+=(--diarize); fi
          if [ "${{ inputs.no_vad }}" = "true" ]; then extra+=(--no-vad); fi
          if [ "${{ inputs.seed_vc }}" = "true" ]; then extra+=(--seed-vc); fi
          if [ "${{ inputs.validate_content }}" = "true" ]; then extra+=(--validate-content); fi
          profile_args=()
          if [ -n "${{ inputs.speaker_voices_path }}" ]; then
            test -f "${{ inputs.speaker_voices_path }}" || { echo "speaker voice profile file is missing" >&2; exit 1; }
            profile_args+=(--speaker-voices "${{ inputs.speaker_voices_path }}")
          fi
          python scripts/resumable_smart_dub.py \
            --source "${{ steps.smart_project.outputs.source }}" \
            --project-id "${{ steps.smart_project.outputs.id }}" \
            --release-tag "${{ steps.smart_project.outputs.release_tag }}" \
            --checkpoint-root checkpoints \
            --output-dir output \
            --source-lang "${{ inputs.source_lang }}" \
            --target-lang "${{ inputs.target_lang }}" \
            --tts-engine "${{ inputs.tts_engine }}" \
            --voice "${{ inputs.voice }}" \
            --gender "${{ inputs.gender }}" \
            --model "${{ inputs.model }}" \
            --max-seconds "$chunk_max" \
            --target-seconds "8" \
            --min-seconds "2.5" \
            "${profile_args[@]}" "${extra[@]}"

      - name: Confirm complete resumable delivery
        run: |
          set -euo pipefail
          test -s output/final-dub.mp4
          test -s output/segments-report.json
          test -s output/progress-report.json
          test -s output/checkpoint-manifest.json
          python - <<'PY'
          import json
          p=json.load(open("output/progress-report.json",encoding="utf-8"))
          assert p["state"] == "completed_waiting_for_cleanup_approval", p
          assert p["by_status"].get("completed",0) == p["total"], p
          assert p["cleanup_authorized"] is False, p
          print(json.dumps(p,ensure_ascii=False,indent=2))
          PY

      - name: Validate final target language
        run: |
          set -euo pipefail
          python scripts/validate_dub_language.py \
            --video output/final-dub.mp4 \
            --expected "${{ inputs.target_lang }}" \
            --model "${{ inputs.model }}" \
            --report output/language-integrity.json

      - name: Enforce professional quality gate
        env:
          SOURCE_PATH: ${{ inputs.source_path }}
        run: |
          set -euo pipefail
          quality_source="$SOURCE_PATH"
          if [ -s output/source-path.txt ]; then quality_source=$(cat output/source-path.txt); fi
          if [ ! -f "$quality_source" ]; then
            quality_source=$(find .cache temp -type f \( -name '*.mp4' -o -name '*.mkv' -o -name '*.webm' -o -name '*.wav' \) | head -1)
          fi
          test -n "$quality_source" && test -f "$quality_source"
          python scripts/validate_dub_quality.py \
            --source "$quality_source" \
            --video output/final-dub.mp4 \
            --segments output/segments-report.json \
            --language-report output/language-integrity.json \
            --policy "${{ inputs.quality }}" \
            --report output/quality-report.json

      - name: Publish project, report, and Pages index
        if: success()
        env:
          SOURCE_PATH: ${{ inputs.source_path }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cp output/final-dub.mp4 /tmp/final-dub.mp4
          cp output/quality-report.json /tmp/quality-report.json
          cp output/segments-report.json /tmp/segments-report.json
          cp output/language-integrity.json /tmp/language-integrity.json
          cp output/source-path.txt /tmp/source-path.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin "${{ github.ref_name }}"
            git reset --hard "origin/${{ github.ref_name }}"
            mkdir -p output
            cp /tmp/final-dub.mp4 output/final-dub.mp4
            cp /tmp/quality-report.json output/quality-report.json
            cp /tmp/segments-report.json output/segments-report.json
            cp /tmp/language-integrity.json output/language-integrity.json
            source_for_publish=$(cat /tmp/source-path.txt)
            python scripts/publish_dub_run.py --video output/final-dub.mp4 --source "$source_for_publish" \
              --source-lang "${{ inputs.source_lang }}" --target-lang "${{ inputs.target_lang }}" \
              --engine "${{ inputs.tts_engine }}" --seed-vc "${{ inputs.seed_vc }}" \
              --bg-music "${{ inputs.bg_music }}" --diarize "${{ inputs.diarize }}" --run-id "$RUN_ID"
            python scripts/publish_docs.py
            git add projects docs/projects.json docs/*.mp4 docs/*.srt docs/*.vtt
            git diff --cached --quiet || git commit -m "Publish verified dub $RUN_ID"
            if git push origin HEAD:"${{ github.ref_name }}"; then exit 0; fi
            echo "Concurrent update detected; rebuilding publication from the latest branch ($attempt/3)"
            sleep $((attempt * 3))
          done
          echo "The verified artifact is safe, but Pages publication could not be updated after 3 attempts" >&2
          exit 1

      - name: Conditional lip synchronization
        if: false
        env:
          WAV2LIP_CHECKPOINT: ${{ secrets.WAV2LIP_CHECKPOINT }}
          WAV2LIP_CHECKPOINT_URL: ${{ secrets.WAV2LIP_CHECKPOINT_URL }}
        run: |
          set -euo pipefail
          if [ -n "$WAV2LIP_CHECKPOINT_URL" ]; then
            echo "Wav2Lip checkpoint download remains disabled until a verified checksum is configured in code" >&2
            exit 1
            WAV2LIP_CHECKPOINT=/tmp/wav2lip.pth
          fi
          if [ -z "$WAV2LIP_CHECKPOINT" ]; then
            echo "WAV2LIP_CHECKPOINT is not configured; preserving the validated Seed-VC audio dub."
            printf '%s\n' '{"requested":true,"applied":false,"reason":"missing_verified_checkpoint","quality":"unvalidated"}' > output/lip-sync-report.json
            exit 0
          fi
          if [ ! -f "$WAV2LIP_CHECKPOINT" ]; then
            echo "WAV2LIP_CHECKPOINT does not exist on this runner; preserving the validated Seed-VC audio dub."
            printf '%s\n' '{"requested":true,"applied":false,"reason":"checkpoint_path_missing","quality":"unvalidated"}' > output/lip-sync-report.json
            exit 0
          fi
          python -m pip install opencv-python-headless
          git clone --depth 1 https://github.com/Rudrabha/Wav2Lip.git /tmp/Wav2Lip
          python lip_sync/run.py \
            --video output/seedvc-enhanced.mp4 \
            --audio output/seedvc-enhanced.seed-work/final-mixed.wav \
            --wav2lip-repo /tmp/Wav2Lip \
            --checkpoint "$WAV2LIP_CHECKPOINT" \
            --output output/lipsynced.mp4 \
            --min-coverage 0.20 \
            --min-face-ratio 0.008
          rm -f output/seedvc-enhanced.mp4
          mv output/lipsynced.mp4 output/seedvc-enhanced.mp4

      - name: Upload final delivery and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-dubbed-video
          path: |
            output/final-dub.mp4
            output/quality-report.json
            output/segments-report.json
            output/language-integrity.json
            output/preflight.json
            output/progress-report.json
            output/checkpoint-manifest.json
            output/speaker-analysis.json
          if-no-files-found: error
          retention-days: 14
