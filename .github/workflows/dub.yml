name: Run YouTube Auto Dub

permissions:
  contents: write

# Two jobs, pick one from the "Run workflow" dropdown:
#   clone  — re-record a project's lines in the original actor's voice (F5-TTS)
#   dub    — dub a YouTube URL from scratch
#
# Cloning needs model weights from HuggingFace. That host is blocked in the dev
# sandbox but reachable from GitHub's runners, which is the whole reason this
# workflow exists.

on:
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        required: true
        default: "clone"
        type: choice
        options:
          - clone
          - dub
      project:
        description: "clone: project folder under projects/"
        required: false
        default: "Phantom-Thread"
        type: string
      ref_seconds:
        description: "clone: seconds of the actor to clone from (3-12)"
        required: false
        default: "8"
        type: string
      max_cues:
        description: "clone: 0 = all lines, or e.g. 3 for a quick voice preview"
        required: false
        default: "0"
        type: string
      youtube_url:
        description: "dub: video URL (leave empty when using source_path)"
        required: false
        default: ""
        type: string
      source_path:
        description: "dub: path to a video already in this repository"
        required: false
        default: "samples/ProStudio_Arabic_Demo.mp4"
        type: string
      source_lang:
        description: "dub: original audio language"
        required: false
        default: "ar"
        type: string
      voice:
        description: "dub: Edge-TTS voice short name"
        required: false
        default: "en-US-AndrewMultilingualNeural"
        type: string
      tts_engine:
        description: "dub: speech engine (xtts clones the source voice)"
        required: false
        default: "xtts"
        type: choice
        options: [xtts, edge, voxcpm, qwen]
      target_lang:
        description: "dub: target language"
        required: false
        default: "en"
        type: string
      mode:
        description: "dub: mode"
        required: false
        default: "both"
        type: choice
        options: [both, dub, sub]
      gender:
        description: "dub: voice gender"
        required: false
        default: "male"
        type: choice
        options: [male, female]
      model:
        description: "dub: Whisper model"
        required: false
        default: "base"
        type: choice
        options: [tiny, base, small, medium]
      bg_music:
        description: "dub: keep background music and effects when separation is reliable"
        required: false
        default: false
        type: boolean
      diarize:
        description: "dub: identify speakers automatically when HF_TOKEN is configured"
        required: false
        default: false
        type: boolean
      separate_sources:
        description: "dub: neural separation of dialogue from music/effects"
        required: false
        default: false
        type: boolean
      seed_vc:
        description: "dub: transfer the source voice identity with Seed-VC"
        required: false
        default: true
        type: boolean
      lip_sync:
        description: "deprecated: visual lip-sync is disabled; audio-only dubbing is used"
        required: false
        default: false
        type: boolean
      lip_sync_backend:
        description: "dub: verified visual backend"
        required: false
        default: "wav2lip"
        type: choice
        options: [wav2lip, experiment]
      profile:
        description: "dub: pipeline profile"
        required: false
        default: "safe"
        type: choice
        options: [safe, high_quality_single, multi_speaker_cinematic, experiment]
      quality:
        description: "dub: quality policy"
        required: false
        default: "balanced"
        type: choice
        options: [safe, balanced, strict]
      wav2lip_sha256:
        description: "sha256 for the approved Wav2Lip checkpoint downloaded from WAV2LIP_CHECKPOINT_URL"
        required: false
        default: ""
        type: string

jobs:
  clone:
    if: inputs.task == 'clone'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out this branch
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # The weights are the slow part of the run; keep them between runs.
      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-f5tts-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # One resolve, so pip picks a consistent set. coqui-tts (XTTS-v2)
          # needs transformers >=4.57 but breaks on 5.x, which removed
          # isin_mps_friendly — installing them separately picks 5.x and fails.
          pip install "transformers>=4.57,<5" coqui-tts f5-tts

      - name: Confirm the weights downloaded
        env:
          COQUI_TOS_AGREED: "1"
        run: |
          python - <<'PY'
          from youtube_auto_dub.xtts_clone import available, MODEL_NAME
          if available():
              print(f"XTTS-v2 ready ({MODEL_NAME})")
          else:
              from f5_tts.api import F5TTS
              F5TTS()
              print("XTTS unavailable; F5-TTS ready")
          PY

      - name: Clone each line in the original actor's voice
        env:
          PROJECT: ${{ inputs.project }}
          REF_SECONDS: ${{ inputs.ref_seconds }}
          MAX_CUES: ${{ inputs.max_cues }}
          COQUI_TOS_AGREED: "1"
        run: python scripts/clone_project.py

      # Upload the voices before rendering. Cloning costs about an hour, and a
      # later failure used to throw all of it away.
      - name: Upload the cloned voices
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloned-voices-${{ inputs.project }}
          path: |
            projects/${{ inputs.project }}/voices/*.wav
            projects/${{ inputs.project }}/work/ref_*.wav
          if-no-files-found: warn
          retention-days: 30

      - name: Render the dub
        if: inputs.max_cues == '0'
        env:
          PROJECT: ${{ inputs.project }}
        run: python scripts/build_phantom_dub.py

      - name: Upload the finished dub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloned-dub-${{ inputs.project }}
          path: |
            projects/${{ inputs.project }}/output/*.mp4
            projects/${{ inputs.project }}/output/*.srt
          if-no-files-found: warn
          retention-days: 30

  dub:
    if: inputs.task == 'dub'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out this branch
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U yt-dlp
          pip install -r requirements.txt
          pip install faster-whisper edge-tts
          pip install gradio_client

      # Download the selected Whisper weights on the GitHub runner. The cache
      # makes later runs fast while keeping all model files inside GitHub.
      - name: Cache Whisper model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-faster-whisper-${{ inputs.model }}-v1

      - name: Download and verify Whisper model
        env:
          WHISPER_MODEL: ${{ inputs.model }}
        run: |
          python - <<'PY'
          import os
          from faster_whisper import WhisperModel
          model_name = os.environ["WHISPER_MODEL"]
          WhisperModel(model_name, device="cpu", compute_type="int8")
          print(f"Whisper model ready: {model_name}")
          PY

      - name: Cache XTTS-v2 model
        if: inputs.tts_engine == 'xtts'
        uses: actions/cache@v4
        with:
          path: ~/.local/share/tts
          key: coqui-xtts-v2-v1

      - name: Download and verify XTTS-v2
        if: inputs.tts_engine == 'xtts'
        run: |
          pip install torchaudio "transformers>=4.57,<5" "coqui-tts[codec]"
          COQUI_TOS_AGREED=1 python - <<'PY'
          from TTS.api import TTS
          TTS("tts_models/multilingual/multi-dataset/xtts_v2")
          print("XTTS-v2 ready")
          PY

      - name: Install optional speaker diarization
        if: inputs.diarize == true
        run: python -m pip install pyannote.audio
      - name: Install optional neural source separation
        if: inputs.separate_sources == true
        run: python -m pip install demucs
      - name: Write YouTube cookies
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "${YT_COOKIES}" ]; then
            printf '%s\n' "$YT_COOKIES" > cookies.txt
            echo "cookies.txt ready"
          else
            echo "No YT_COOKIES secret set; continuing without it"
          fi

      - name: Preflight environment and credentials
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          set -euo pipefail
          mkdir -p output
          ffmpeg -version >/dev/null
          python - <<'PY'
          import json, os, shutil
          report = {
            "ffmpeg": bool(shutil.which("ffmpeg")),
            "ffprobe": bool(shutil.which("ffprobe")),
            "source_lang": "${{ inputs.source_lang }}",
            "target_lang": "${{ inputs.target_lang }}",
            "tts_engine": "${{ inputs.tts_engine }}",
            "seed_vc_requested": "${{ inputs.seed_vc }}" == "true",
            "diarization_requested": "${{ inputs.diarize }}" == "true",
            "demucs_requested": "${{ inputs.separate_sources }}" == "true",
            "seed_vc_script": os.path.exists("scripts/seed_vc_enhance.py"),
            "hf_token_present": bool(os.environ.get("HF_TOKEN")),
            "youtube_cookies_present": bool(os.environ.get("YT_COOKIES")),
            "lip_sync": "disabled",
            "status": "ready_with_warnings",
          }
          if report["diarization_requested"] and not report["hf_token_present"]:
            report["status"] = "blocked_missing_hf_token"
            report["error"] = "HF_TOKEN is required when diarize=true"
          if report["seed_vc_requested"] and not report["seed_vc_script"]:
            report["status"] = "blocked_missing_seed_vc"
            report["error"] = "Seed-VC integration script is missing"
          with open("output/preflight.json", "w", encoding="utf-8") as f:
            json.dump(report, f, ensure_ascii=False, indent=2)
          print(json.dumps(report, ensure_ascii=False))
          if report["status"].startswith("blocked_"):
            raise SystemExit(report["error"])
          PY

      - name: Upload preflight diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-${{ github.run_id }}
          path: output/preflight.json
          if-no-files-found: warn
          retention-days: 14

      - name: Run the dub
        env:
          YAD_OUTPUT_DIR: output
          YAD_VOXCPM_BACKEND: "space"
          YAD_TEMP_DIR: temp
          YAD_CACHE_DIR: .cache
          YAD_COOKIES_FILE: cookies.txt
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          source="${{ inputs.youtube_url }}"
          if [ -z "$source" ]; then
            source="${{ inputs.source_path }}"
          fi
          if [ -z "$source" ] || [ ! -e "$source" ] && [[ "$source" != http* ]]; then
            echo "No valid youtube_url or source_path was supplied" >&2
            exit 1
          fi
          extra=()
          if [ "${{ inputs.bg_music }}" = "true" ]; then
            extra+=(--bg-music)
          fi
          if [ "${{ inputs.diarize }}" = "true" ]; then
            extra+=(--diarize)
          fi
          python -m youtube_auto_dub "$source" \
            --lang "${{ inputs.target_lang }}" \
            --dub-lang "${{ inputs.target_lang }}" \
            --source-lang "${{ inputs.source_lang }}" \
            --voice "${{ inputs.voice }}" \
            --tts-engine "${{ inputs.tts_engine }}" \
            --mode "${{ inputs.mode }}" \
            --gender "${{ inputs.gender }}" \
            --model "${{ inputs.model }}" \
            -o output \
            "${extra[@]}"
          ls -lh output

      - name: Enhance voice with Seed-VC
        if: inputs.seed_vc == true
        env:
          SOURCE_PATH: ${{ inputs.source_path }}
        run: |
          set -euo pipefail
          # The renderer names outputs as Output_both_L-*_D-*.mp4; choose the newest one.
          dubbed=$(find output -maxdepth 1 -type f -name 'Output_*.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          if [ -z "$dubbed" ]; then
            echo "No dubbed video found for Seed-VC" >&2
            exit 1
          fi
          cp "$dubbed" output/dubbed-before-seedvc.mp4
          extra=()
          if [ "${{ inputs.bg_music }}" = "true" ]; then
            extra+=(--keep-background)
          fi
          if [ "${{ inputs.separate_sources }}" = "true" ]; then
            extra+=(--separate-sources)
          fi
          python scripts/seed_vc_enhance.py \
            --original "$SOURCE_PATH" \
            --dubbed "$dubbed" \
            --output output/seedvc-enhanced.mp4 \
            "${extra[@]}"
          rm -f "$dubbed"

      - name: Validate target-language audio after Seed-VC
        if: inputs.seed_vc == true
        run: |
          set -euo pipefail
          if python scripts/validate_dub_language.py \
            --video output/seedvc-enhanced.mp4 \
            --expected "${{ inputs.target_lang }}" \
            --model "${{ inputs.model }}" \
            --report output/language-integrity.json; then
            echo "Seed-VC target-language integrity passed"
          else
            echo "Seed-VC changed or obscured the target language; restoring the verified raw translated dub"
            cat output/language-integrity.json
            cp output/dubbed-before-seedvc.mp4 output/seedvc-enhanced.mp4
          fi

      - name: Publish project, report, and Pages index
        if: success()
        env:
          SOURCE_PATH: ${{ inputs.source_path }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          final="output/seedvc-enhanced.mp4"
          if [ ! -f "$final" ]; then final=$(find output -maxdepth 1 -type f -name '*.mp4' | head -1); fi
          test -n "$final" && test -f "$final"
          python scripts/publish_dub_run.py --video "$final" --source "$SOURCE_PATH" \
            --source-lang "${{ inputs.source_lang }}" --target-lang "${{ inputs.target_lang }}" \
            --engine "${{ inputs.tts_engine }}" --seed-vc "${{ inputs.seed_vc }}" \
            --bg-music "${{ inputs.bg_music }}" --diarize "${{ inputs.diarize }}" --run-id "$RUN_ID"
          python scripts/publish_docs.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects docs/projects.json docs/*.mp4 docs/*.srt docs/*.vtt
          git diff --cached --quiet || git commit -m "Publish dub $RUN_ID to project library"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:${{ github.ref_name }}

      - name: Conditional lip synchronization
        if: false
        env:
          WAV2LIP_CHECKPOINT: ${{ secrets.WAV2LIP_CHECKPOINT }}
          WAV2LIP_CHECKPOINT_URL: ${{ secrets.WAV2LIP_CHECKPOINT_URL }}
        run: |
          set -euo pipefail
          if [ -n "$WAV2LIP_CHECKPOINT_URL" ]; then
            test -n "${{ inputs.wav2lip_sha256 }}" || { echo "wav2lip_sha256 is required when downloading a checkpoint" >&2; exit 1; }
            curl --fail --location --retry 3 --output /tmp/wav2lip.pth "$WAV2LIP_CHECKPOINT_URL"
            echo "${{ inputs.wav2lip_sha256 }}  /tmp/wav2lip.pth" | sha256sum --check
            WAV2LIP_CHECKPOINT=/tmp/wav2lip.pth
          fi
          if [ -z "$WAV2LIP_CHECKPOINT" ]; then
            echo "WAV2LIP_CHECKPOINT is not configured; preserving the validated Seed-VC audio dub."
            printf '%s\n' '{"requested":true,"applied":false,"reason":"missing_verified_checkpoint","quality":"unvalidated"}' > output/lip-sync-report.json
            exit 0
          fi
          if [ ! -f "$WAV2LIP_CHECKPOINT" ]; then
            echo "WAV2LIP_CHECKPOINT does not exist on this runner; preserving the validated Seed-VC audio dub."
            printf '%s\n' '{"requested":true,"applied":false,"reason":"checkpoint_path_missing","quality":"unvalidated"}' > output/lip-sync-report.json
            exit 0
          fi
          python -m pip install opencv-python-headless
          git clone --depth 1 https://github.com/Rudrabha/Wav2Lip.git /tmp/Wav2Lip
          python lip_sync/run.py \
            --video output/seedvc-enhanced.mp4 \
            --audio output/seedvc-enhanced.seed-work/final-mixed.wav \
            --wav2lip-repo /tmp/Wav2Lip \
            --checkpoint "$WAV2LIP_CHECKPOINT" \
            --output output/lipsynced.mp4 \
            --min-coverage 0.20 \
            --min-face-ratio 0.008
          rm -f output/seedvc-enhanced.mp4
          mv output/lipsynced.mp4 output/seedvc-enhanced.mp4

      - name: Upload the dubbed video
        uses: actions/upload-artifact@v4
        with:
          name: final-dubbed-video
          path: |
            output/*.mp4
            output/*.srt
            output/*.pipeline.json
            output/*-report.json
            output/**/*.json
            output/**/*.log
          if-no-files-found: error
          retention-days: 14
