name: Audio Diagnostic
on:
  workflow_dispatch:
    inputs:
      dir:
        description: "folder of mp4s to analyze"
        required: false
        default: "output/dubbed"
        type: string
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Measure audio level of each file
        run: |
          shopt -s nullglob
          for f in "${{ inputs.dir }}"/*.mp4; do
            echo "==================================================="
            echo "FILE: $f"
            abr=$(ffprobe -v error -select_streams a:0 -show_entries stream=bit_rate,channels,sample_rate -of default=noprint_wrappers=1 "$f")
            echo "audio_stream: $abr"
            echo "--- loudness ---"
            ffmpeg -hide_banner -i "$f" -vn -af volumedetect -f null - 2>&1 | grep -iE "mean_volume|max_volume" || echo "NO_VOLUME_OUTPUT"
          done
          echo "ALL_DONE"
