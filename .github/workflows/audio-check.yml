name: Audio Diagnostic
on:
  workflow_dispatch:
    inputs:
      dir:
        description: "folder of mp4s to analyze"
        required: false
        default: "output/dubbed"
        type: string
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Analyze
        run: |
          shopt -s nullglob
          for f in "${{ inputs.dir }}"/*.mp4; do
            echo "==================================================="
            echo "FILE: $f"
            dur=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$f")
            echo "duration: $dur"
            echo "--- loudness ---"
            ffmpeg -hide_banner -i "$f" -vn -af volumedetect -f null - 2>&1 | grep -iE "mean_volume|max_volume" || echo "NONE"
            echo "--- silence gaps (below -45dB, >=0.4s) ---"
            ffmpeg -hide_banner -i "$f" -vn -af silencedetect=noise=-45dB:d=0.4 -f null - 2>&1 | grep -iE "silence_start|silence_end|silence_duration" || echo "no gaps"
          done
          echo "ALL_DONE"
